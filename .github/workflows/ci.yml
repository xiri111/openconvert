name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装核心与开发依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 静态检查
        run: ruff check .

      - name: 单元与集成测试
        run: pytest -q

      - name: 构建插件并验证装上出现
        run: |
          python -m build plugins/openconvert-md --outdir dist-plugin
          python -m pip install dist-plugin/*.whl
          openconvert formats | grep -q markdown
          openconvert convert -i samples/学生.csv -f markdown -o /tmp/结果.md
          test -s /tmp/结果.md
          pytest plugins/openconvert-md/tests -q

      - name: 卸载后格式消失且 JSON 不受影响
        run: |
          python -m pip uninstall -y openconvert-md
          ! openconvert formats | grep -q markdown
          openconvert convert -i samples/学生.csv -f json -o /tmp/结果.json
          test -s /tmp/结果.json
